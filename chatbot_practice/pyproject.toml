[project]
name = "chatbot-practice"
version = "0.1.0"
description = "Professional local AI chatbot using Ollama and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6.2",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
